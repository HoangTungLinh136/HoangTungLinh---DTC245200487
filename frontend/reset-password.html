<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizSystem — Đặt Lại Mật Khẩu</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: radial-gradient(circle at 50% 10%, #e0e7ff 0%, #f8fafc 60%);
    }
    .auth-card {
      max-width: 440px;
      width: 100%;
      background: #ffffff;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
      padding: 2.5rem 2rem;
    }
  </style>
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">
    <div style="text-align: center; margin-bottom: 2rem;">
      <h2 style="color: var(--primary); margin-bottom: 0.25rem;">Đặt Lại Mật Khẩu</h2>
      <p style="font-size: 0.875rem; color: var(--text-muted);">QuizSystem — Đề tài 35</p>
    </div>

    <form onsubmit="handleResetPassword(event)">
      <div class="form-group">
        <label class="form-label" for="new-password">Mật khẩu mới (tối thiểu 8 ký tự)</label>
        <input type="password" id="new-password" class="form-control" required minlength="8" placeholder="••••••••">
      </div>
      <div class="form-group">
        <label class="form-label" for="confirm-password">Xác nhận mật khẩu mới</label>
        <input type="password" id="confirm-password" class="form-control" required minlength="8" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%;" id="btn-submit-reset">Xác Nhận Đổi Mật Khẩu</button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem;">
      <a href="/index.html" style="font-size: 0.85rem; color: var(--primary); text-decoration: none;">← Quay lại trang Đăng nhập</a>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  async function handleResetPassword(e) {
    e.preventDefault();
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (!token) {
      showToast('Không tìm thấy mã xác thực token trên đường dẫn URL.', 'error');
      return;
    }

    const newPassword = document.getElementById('new-password').value;
    const confirmPassword = document.getElementById('confirm-password').value;

    if (newPassword !== confirmPassword) {
      showToast('Mật khẩu xác nhận không khớp.', 'error');
      return;
    }

    const btn = document.getElementById('btn-submit-reset');
    try {
      btn.disabled = true;
      btn.textContent = 'Đang xử lý...';

      const res = await API.post('/auth/reset-password', { token, newPassword });
      showToast(res.message, 'success');

      setTimeout(() => {
        window.location.href = '/index.html';
      }, 1500);
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Xác Nhận Đổi Mật Khẩu';
    }
  }
</script>

</body>
</html>
